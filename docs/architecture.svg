<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="960" fill="#f8fafc"/>

  <!-- ===================== PANEL A: one heartbeat run ===================== -->
  <text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">One heartbeat run</text>
  <text x="40" y="72" font-size="14" fill="#64748b">packages/action — pure logic (green outline) around a thin I/O layer</text>

  <!-- Inputs -->
  <g>
    <rect x="40" y="110" width="230" height="56" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="60" y="138" font-size="15" font-weight="600" fill="#0f172a">WILL.md</text>
    <text x="60" y="156" font-size="12" fill="#64748b">config: deadlines, successors…</text>

    <rect x="40" y="182" width="230" height="56" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="60" y="210" font-size="15" font-weight="600" fill="#0f172a">.will/state.json</text>
    <text x="60" y="228" font-size="12" fill="#64748b">memory: previous stage</text>

    <rect x="40" y="254" width="230" height="56" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="60" y="282" font-size="15" font-weight="600" fill="#0f172a">GitHub API</text>
    <text x="60" y="300" font-size="12" fill="#64748b">commits, comments, /alive…</text>
  </g>

  <!-- prep (pure) -->
  <rect x="320" y="130" width="200" height="160" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="176" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">parseWill()</text>
  <text x="420" y="198" font-size="12" fill="#166534" text-anchor="middle">validate +</text>
  <text x="420" y="214" font-size="12" fill="#166534" text-anchor="middle">normalize</text>
  <line x1="360" y1="232" x2="480" y2="232" stroke="#86efac" stroke-width="1"/>
  <text x="420" y="256" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">latestSignal()</text>
  <text x="420" y="276" font-size="12" fill="#166534" text-anchor="middle">newest sign of life</text>

  <!-- computeStage (the heart) -->
  <rect x="580" y="120" width="220" height="180" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="690" y="158" font-size="17" font-weight="800" fill="#3730a3" text-anchor="middle">computeStage()</text>
  <text x="690" y="180" font-size="12" fill="#4338ca" text-anchor="middle">pure function, time = param</text>
  <text x="600" y="212" font-size="12" fill="#1e293b">elapsed = now − lastSignal</text>
  <text x="600" y="234" font-size="12" fill="#1e293b">dwell   = now − stage_since</text>
  <text x="600" y="262" font-size="12" fill="#1e293b">⇒ new stage +</text>
  <text x="600" y="280" font-size="12" fill="#1e293b">   changed / reset</text>

  <!-- Outputs -->
  <g>
    <rect x="880" y="96" width="300" height="46" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="900" y="120" font-size="14" font-weight="600" fill="#0f172a">.will/state.json</text>
    <text x="900" y="135" font-size="11" fill="#64748b">written back</text>

    <rect x="880" y="152" width="300" height="46" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="900" y="176" font-size="14" font-weight="600" fill="#0f172a">.will/badge.json</text>
    <text x="900" y="191" font-size="11" fill="#64748b">shields.io endpoint</text>

    <rect x="880" y="208" width="300" height="46" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="900" y="232" font-size="14" font-weight="600" fill="#0f172a">comment on Will issue</text>
    <text x="900" y="247" font-size="11" fill="#64748b">only on a stage change</text>

    <rect x="880" y="264" width="300" height="46" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="900" y="288" font-size="14" font-weight="600" fill="#0f172a">git commit</text>
    <text x="900" y="303" font-size="11" fill="#64748b">keeps the 60-day schedule alive</text>
  </g>

  <!-- arrows A -->
  <path d="M270 138 L314 180" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M270 282 L314 250" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M270 210 L574 210" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="203" font-size="11" fill="#64748b">prev</text>
  <path d="M520 210 L574 210" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M800 200 L874 119" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M800 205 L874 175" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M800 215 L874 231" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M800 225 L874 287" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="40" y1="350" x2="1200" y2="350" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===================== PANEL B: state machine ===================== -->
  <text x="40" y="398" font-size="24" font-weight="700" fill="#0f172a">The state machine</text>
  <text x="40" y="424" font-size="14" fill="#64748b">packages/core/stage.ts — two clocks: elapsed (since last activity) and dwell (since entering the stage)</text>

  <!-- stage nodes -->
  <!-- active -->
  <rect x="40" y="470" width="150" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="115" y="500" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">active</text>
  <text x="115" y="520" font-size="11" fill="#166534" text-anchor="middle">green · seen Nd ago</text>

  <!-- reminder -->
  <rect x="255" y="470" width="150" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="500" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">reminder</text>
  <text x="330" y="520" font-size="11" fill="#166534" text-anchor="middle">green · private nudge</text>

  <!-- warning -->
  <rect x="470" y="470" width="150" height="64" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="545" y="500" font-size="16" font-weight="700" fill="#9a3412" text-anchor="middle">warning</text>
  <text x="545" y="520" font-size="11" fill="#9a3412" text-anchor="middle">orange · public</text>

  <!-- handover -->
  <rect x="685" y="470" width="150" height="64" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="760" y="500" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">handover</text>
  <text x="760" y="520" font-size="11" fill="#991b1b" text-anchor="middle">red · dry run</text>

  <!-- handed_over -->
  <rect x="900" y="470" width="150" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="975" y="497" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle">handed_over</text>
  <text x="975" y="518" font-size="11" fill="#1e40af" text-anchor="middle">blue · terminal</text>

  <!-- fallback -->
  <rect x="685" y="620" width="150" height="64" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="760" y="650" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">fallback</text>
  <text x="760" y="670" font-size="11" fill="#334155" text-anchor="middle">grey · seeking adopter</text>

  <!-- forward transitions -->
  <path d="M190 502 L251 502" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="220" y="493" font-size="11" fill="#334155" text-anchor="middle">elapsed ≥</text>
  <text x="220" y="459" font-size="11" fill="#334155" text-anchor="middle">50% window</text>

  <path d="M405 502 L466 502" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="435" y="493" font-size="11" fill="#334155" text-anchor="middle">elapsed ≥</text>
  <text x="435" y="459" font-size="11" fill="#334155" text-anchor="middle">inactivity</text>

  <path d="M620 502 L681 502" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="650" y="493" font-size="11" fill="#334155" text-anchor="middle">dwell ≥</text>
  <text x="650" y="459" font-size="11" fill="#334155" text-anchor="middle">grace</text>

  <path d="M835 502 L896 502" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="866" y="493" font-size="11" fill="#334155" text-anchor="middle">approvals</text>
  <text x="866" y="459" font-size="11" fill="#334155" text-anchor="middle">≥ quorum</text>

  <path d="M760 534 L760 616" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="772" y="580" font-size="11" fill="#334155">dwell ≥ accept_within</text>
  <text x="772" y="596" font-size="11" fill="#64748b">(without quorum)</text>

  <!-- reset arc back to active -->
  <path d="M760 684 C 400 800, 120 760, 115 538"
        fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrowGreen)"/>
  <path d="M545 534 C 420 640, 220 640, 130 538"
        fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrowGreen)"/>
  <rect x="360" y="726" width="470" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="595" y="748" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">reset — a single maintainer signal ⇒ active</text>
  <text x="595" y="766" font-size="11.5" fill="#166534" text-anchor="middle">from reminder / warning / handover / fallback · the log is kept</text>

  <!-- note: handed_over terminal -->
  <text x="900" y="558" font-size="11" fill="#64748b">✗ no reset (terminal)</text>

  <!-- legend for two clocks -->
  <rect x="900" y="620" width="300" height="120" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="918" y="646" font-size="13" font-weight="700" fill="#0f172a">Two clocks</text>
  <text x="918" y="670" font-size="12" font-weight="600" fill="#1e293b">elapsed — since last activity</text>
  <text x="930" y="686" font-size="12" fill="#64748b">active → reminder → warning</text>
  <text x="918" y="710" font-size="12" font-weight="600" fill="#1e293b">dwell — since entering the stage</text>
  <text x="930" y="726" font-size="12" fill="#64748b">deadlines after that (grace, accept_within)</text>

  <text x="40" y="920" font-size="12" fill="#94a3b8">Maintainer's Will v0.1 · the same pure function drives the action, CLI simulation and tests — only now and the signal source differ.</text>
</svg>
